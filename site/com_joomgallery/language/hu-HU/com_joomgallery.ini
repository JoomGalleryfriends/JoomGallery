COM_JOOMGALLERY_CONFIG_ADD_WATERMARK="Vízjel hozzáadása?"
COM_JOOMGALLERY_CONFIG_ADD_WATERMARK_IMG_LONG="Vízjelet szeretne hozzáadni a képhez?{tip}A vízjel grafikus fájl alapértelmezés szerint a 'media/joomgallery/images/' könyvtárban található, a watermark.png fájlnévvel. Az <i>Általános beállítások » Képfeldolgozás » Vízjel</i> menüpontban egy másik fájl kiválasztásával mind az elérési utat, mind a fájlnevet megváltoztathatja."
COM_JOOMGALLERY_CONFIG_SHOW_EXIFDATA="Mutasd az Exif adatokat?"
COM_JOOMGALLERY_CONFIG_SHOW_EXIFDATA_IMG_LONG="A kép Exif-adatai megjelenjenek, ha rendelkezésre állnak?{tip}Ha \"Igen\", akkor a következő beállításokkal eldöntheti, hogy mely információk kerüljenek közzétételre. Ellenkező esetben ezek hatástalanok."
COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING="Térkép mutatása?"
COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING_IMG_LONG="Szeretne egy térképet hozzáadni, amely megmutatja, hogy hol készült a kép?{tip}Az eredeti kép GPS-adatai felhasználhatók a térképen való megjelenítéshez. Ha a kép érvényes GPS-adatokat tartalmaz az Exif-információkon belül, akkor a részletnézetben megjelenik egy további terület a térképpel."
