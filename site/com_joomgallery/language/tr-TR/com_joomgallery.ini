COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING_IMG_LONG="Görüntünün nerede çekildiğini gösteren bir harita eklemek ister misiniz?{tip}Orijinal görüntünün GPS verilerini kullanarak bir Haritada konum olarak gösterebilirsiniz. Görüntü, EXIF bilgileri içinde geçerli GPS verileri içeriyorsa, ayrıntılı görünümde haritayla birlikte ek bir alan görüntülenir."
COM_JOOMGALLERY_CONFIG_SHOW_IPTCDATA="IPTC verilerini göster"
COM_JOOMGALLERY_CONFIG_SHOW_IPTCDATA_IMG_LONG="Görüntünün IPTC verileri varsa gösterilecek mi?{tip}Aşağıdaki seçeneklerle \"Evet\" yanıtını verirseniz, hangi bilgilerin yayınlanacağına karar verebilirsiniz. Aksi takdirde, veriler etkili olmayacaktır."
