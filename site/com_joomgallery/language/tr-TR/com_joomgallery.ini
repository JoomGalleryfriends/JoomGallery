COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK="Filigran Ekle"
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_CAT_LONG="Bu kategorideki ayrıntılı/orijinal görsellerde Filigranın gösterilip gösterilmeyeceğini buradan ayarlayabilirsiniz.{tip}Bu, 'Ayrıntı Görünümü->Genel Ayarlar->Filigran Ekle?' sekmesindeki ayarı geçersiz kılabilir. JoomGallery Yapılandırması'nda"
