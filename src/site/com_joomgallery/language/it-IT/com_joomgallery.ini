;Configuration
COM_JOOMGALLERY_CONFIG_TYPEPARAMS_INFO="Il parametro globale corrente viene calcolato in base all'<a target=\"_blank\" href=\"index.php?option=com_config&view=component&component=com_joomgallery\">ereditarietà della configurazione</a> scelta e all'<a target=\" _blank\" href=\"index.php?option=com_joomgallery&view=configs\">insieme di configurazione</a> assegnato all'utente corrente.<br />Il valore effettivamente applicato potrebbe essere diverso!"
COM_JOOMGALLERY_CONFIG_ADD_WATERMARK="Aggiungere una filigrana?"
COM_JOOMGALLERY_CONFIG_ADD_WATERMARK_IMG_LONG="Vuoi aggiungere una filigrana all'immagine?{tip}Per impostazione predefinita, il file grafico della filigrana si trova in \"media/joomgallery/images/\" con il nome file watermark.png. È possibile modificare il percorso e il nome del file selezionando un altro file in <i>Impostazioni generali » Elaborazione immagine » Filigrana</i>."
COM_JOOMGALLERY_CONFIG_SHOW_EXIFDATA="Visualizzare i dati Exif?"
COM_JOOMGALLERY_CONFIG_SHOW_EXIFDATA_IMG_LONG="Mostrare i dati Exif dell'immagine, se disponibili?{tip}Se scegli \"Sì\", puoi usare le opzioni seguenti per decidere quali informazioni pubblicare. Altrimenti queste opzioni non avranno effetto."
COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING="Mostrare la mappa?"
COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING_IMG_LONG="Desideri aggiungere una mappa che mostri dove è stata scattata l'immagine? {tip} È possibile utilizzare i dati GPS dell'immagine originale per visualizzarli come posizione su una mappa. Se l'immagine contiene dati GPS validi nelle informazioni Exif, nella visualizzazione dettagliata verrà visualizzata un'area aggiuntiva con la mappa."
COM_JOOMGALLERY_CONFIG_SHOW_IPTCDATA="Visualizzare i dati IPTC?"
COM_JOOMGALLERY_CONFIG_SHOW_IPTCDATA_IMG_LONG="Mostrare i dati IPTC dell'immagine, se disponibili?{tip}Se scegli \"Sì\", puoi usare le opzioni seguenti per decidere quali informazioni pubblicare. Altrimenti queste opzioni non avranno effetto."
COM_JOOMGALLERY_CONFIG_OFFER_DOWNLOAD="Consenti download"
COM_JOOMGALLERY_CONFIG_OFFER_DOWNLOAD_CAT_LONG="Qui è possibile configurare se i download sono consentiti per questa categoria.{tip} Ciò sovrascriverà le impostazioni nella scheda \"Diritti di accesso utente->Download->Consenti download\" nella configurazione JoomGallery."
COM_JOOMGALLERY_CONFIG_ALLOW_COMMENT="Consentire commenti"
COM_JOOMGALLERY_CONFIG_ALLOW_COMMENT_CAT_LONG="Qui puoi impostare se i commenti sono consentiti in questa categoria.{tip}Ciò potrebbe sovrascrivere l'impostazione nella scheda \"Diritti di accesso utente->Commenti->Consenti commenti\" nella configurazione JoomGallery."
COM_JOOMGALLERY_CONFIG_ALLOW_RATING="Autorizzare la valutazione"
COM_JOOMGALLERY_CONFIG_ALLOW_RATING_CAT_LONG="Qui è possibile impostare se la valutazione è consentita in questa categoria.{tip}Ciò potrebbe sovrascrivere l'impostazione nella scheda \"Diritti di accesso utente->Voti->Consenti valutazione\" nella configurazione JoomGallery."
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK="Aggiungere una filigrana"
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_CAT_LONG="Qui puoi decidere se mostrare la filigrana sulle immagini di dettaglio/originali di questa categoria.{tip}Questa impostazione può prevalere su quella nella scheda 'Vista dettagliata->Impostazioni generali->Aggiungere una filigrana?' della configurazione di JoomGallery."
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_DOWNLOAD="Scarica con filigrana"
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_DOWNLOAD_CAT_LONG="Qui puoi decidere se includere la filigrana nei file scaricati di questa categoria.{tip}Questa impostazione può prevalere su quella nella scheda 'Diritti di accesso utente->Download->Scarica con filigrana?' della configurazione di JoomGallery."

;Fields
COM_JOOMGALLERY_FIELDS_TIP_MORE="Altre informazioni..."
COM_JOOMGALLERY_FIELDS_FEATURED_DESC="Contrassegna questa immagine come in evidenza.{tip}Ad esempio, il modulo JoomImages può essere configurato per mostrare in una posizione del modulo soltanto le immagini in evidenza."
COM_JOOMGALLERY_FIELDS_AUTHOR_DESC="Autore di questa immagine (Fotografo)"
COM_JOOMGALLERY_FIELDS_OWNER_DESC="Proprietario di questa immagine (caricatore)"
COM_JOOMGALLERY_FIELDS_PASSWORD_DESC="Qui puoi specificare una password per la categoria.{tip}In questo modo, la categoria sarà accessibile solo agli utenti frontend se immettono la password corretta. Tieni presente che la limitazione dell'accesso tramite livelli di accesso è più severa, il che significa che gli utenti non possono accedere a categorie con un livello di accesso troppo alto anche se conoscono la password corrispondente."
COM_JOOMGALLERY_FIELDS_HIDDEN_DESC="Nascondendo questo elemento, non verrà più mostrato nella vista delle categorie, ma resterà accessibile tramite un collegamento diretto.{tip}<b>Ricorda</b> che \"nascondere\" un elemento non lo protegge dall'accesso. Per renderlo inaccessibile, annullane la pubblicazione.<br />Puoi anche gestire alcune immagini nella galleria senza mostrarle: ad esempio, puoi usare la galleria per gestire immagini inserite negli articoli oppure mostrare un'immagine come miniatura di una categoria senza farla comparire nella vista delle categorie."
COM_JOOMGALLERY_FIELDS_CATEGORY_HIDDEN_DESC="Nascondendo questa categoria, non verrà più mostrata nella galleria o nella vista delle categorie, ma resterà accessibile tramite un collegamento diretto.{tip}<b>Ricorda</b> che \"nascondere\" una categoria non la protegge dall'accesso. Per renderla inaccessibile, annullane la pubblicazione.<br />Le categorie nascoste consentono, ad esempio, di creare aree separate nella galleria. Per accedervi, crea una voce di menu per le categorie nascoste."
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_SEARCH="Escludere dalla ricerca"
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_SEARCH_DESC="Attivando questa opzione è possibile escludere questo articolo dalla ricerca.{tip}Si tenga presente che questa opzione non viene passata automaticamente alle sottocategorie. Naturalmente, abilitare questa opzione potrebbe confondere i visitatori del tuo sito perché alcune immagini non appariranno nei risultati di ricerca anche se inseriscono le parole chiave corrette."
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_TOPLISTS="Escludi dalle classifiche"
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_TOPLISTS_DESC="Questa opzione esclude l'elemento dalle classifiche.{tip}L'impostazione non viene ereditata automaticamente dalle sottocategorie. L'esclusione altera le classifiche e i visitatori del sito potrebbero accorgersene."
COM_JOOMGALLERY_FIELDS_THUMBNAIL_DESC="Qui è possibile selezionare un'immagine che è definita come miniatura di questo elemento."
COM_JOOMGALLERY_FIELDS_RESIZING_DESC="Ridimensionare le immagini? Se abiliti il ridimensionamento delle immagini, tutte le immagini caricate verranno ridimensionate alle dimensioni massime specificate (impostazione sotto).{tip}Si consiglia di utilizzare il ridimensionamento delle immagini per i tipi di immagine \"miniatura\" e \"dettaglio\" per evitare problemi di visualizzazione. Se la funzione rimane disabilitata, le immagini verranno visualizzate nella dimensione in cui sono state caricate."
COM_JOOMGALLERY_FIELDS_WATERMARK_DESC="Percorso del file della filigrana, situato sul tuo server. Il percorso deve essere specificato, anche se non si utilizza la funzione filigrana."
COM_JOOMGALLERY_FIELDS_TAG_DESC="Aggiungere i tag e assegnarli all'elemento."
COM_JOOMGALLERY_FIELDS_SELECT_IMAGE="Selezionare un'immagine"
COM_JOOMGALLERY_FIELDS_SELECT_CATEGORY="Scegliere una categoria"

