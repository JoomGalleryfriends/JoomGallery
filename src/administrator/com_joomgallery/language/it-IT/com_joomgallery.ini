COM_JOOMGALLERY_FIELDS_DATABASE_NAME_LABEL="Nome del database"
COM_JOOMGALLERY_FIELDS_DATABASE_PREFIX_LABEL="Prefisso delle tabelle del database"
COM_JOOMGALLERY_FIELDS_EXTENTED_LOG_LABEL="Registrazione estesa"
COM_JOOMGALLERY_FIELDS_EXTENTED_LOG_DESC="Vuoi registrare tutte le informazioni nel file di registro? {tip}In caso contrario verranno registrati solo gli errori. Tieni presente che il file di registro potrebbe quindi diventare molto grande."
COM_JOOMGALLERY_FIELDS_CHECKOWNER_LABEL="Controllare i proprietari"
COM_JOOMGALLERY_FIELDS_CHECKOWNER_DESC="Se impostato su sì, cercheremo di mantenere i proprietari del contenuto migrato. Se un determinato proprietario ID non può essere trovato nell'installazione corrente di Joomla, il proprietario verrà impostato come utente fallback del plug-in \"Verifica proprietario\"."
COM_JOOMGALLERY_FIELDS_IMAGEUSAGE_LABEL="Utilizzo dell'immagine"
COM_JOOMGALLERY_FIELDS_IMAGEUSAGE_DESC="Come vuoi utilizzare le immagini di origine?{tip}<strong>Uso diretto:</strong> Non migra i file immagine e li usa direttamente dalla cartella di origine. Dopo la migrazione saranno disponibili soltanto i tre tipi di immagine standard.<br /><strong>Ricrea</strong>: usa l'immagine originale di origine per ricreare i tipi di immagine (usa l'immagine di dettaglio se l'originale non è disponibile).<br /><strong>Copia</strong>: copia le immagini di origine e le usa come tipi di immagine secondo la mappatura.<br /><strong>Sposta:</strong> sposta le immagini di origine e le usa come tipi di immagine secondo la mappatura."
COM_JOOMGALLERY_FIELDS_IMAGEMAPPING_LABEL="Mappatura delle immagini"
COM_JOOMGALLERY_FIELDS_IMAGEMAPPING_DESC="Applicare la mappatura delle immagini. Quale immagine di origine deve essere utilizzata per creare il tipo di immagine di destinazione. Devi aggiungere una riga per ogni tipo di immagine di destinazione disponibile!"
COM_JOOMGALLERY_FIELDS_SOURCE_IMAGE_LABEL="Immagine sorgente"
COM_JOOMGALLERY_FIELDS_DEST_IMAGE_LABEL="Tipo di immagine di destinazione"
COM_JOOMGALLERY_FIELDS_DEST_EXTENSION_LABEL="Compatibilità dell'estensione di destinazione"
COM_JOOMGALLERY_FIELDS_SRC_EXTENSION_LABEL="Compatibilità delle estensioni sorgente"
COM_JOOMGALLERY_FIELDS_SOURCE_IDS_LABEL="Usa gli IDs di origine"
COM_JOOMGALLERY_FIELDS_SOURCE_IDS_DESC="Se impostato su sì, gli identificatori dei record di origine vengono usati per creare i record di destinazione.{tip}Per usare questa opzione, gli identificatori di origine non devono già esistere nella tabella dei dati di destinazione. Suggerimento: assicurati che le tabelle di destinazione siano vuote."
COM_JOOMGALLERY_FIELDS_REMOVE_PASSWORD_LABEL="Eliminare la password"
COM_JOOMGALLERY_FIELDS_REMOVE_PASSWORD_DESC="Per rimuovere una password esistente, impostare \"Rimuovi password\" su \"Sì\" e salvare la categoria."
COM_JOOMGALLERY_FIELDS_UNIQUEALIAS_LABEL="Verificare l'unicità dell'alias"
COM_JOOMGALLERY_FIELDS_UNIQUEALIAS_DESC="Se disabilitato, l'alias dei record non verrà controllato per l'unicità.{tip}Disabilitalo solo se è veramente necessario! Ciò accelererà la creazione di nuovi record, soprattutto quando si inseriscono in tabelle che contengono già molti record (>10'000)."
COM_JOOMGALLERY_FIELDS_UNIQUEALIAS_SELECT_LABEL="Disattivare il controllo?"
COM_JOOMGALLERY_FIELDS_UNIQUEALIAS_SELECT_DESC="Per quali tipi di contenuti vuoi disabilitare il controllo dell'unicità degli alias?"

;Configuration
COM_JOOMGALLERY_CONFIG_INHERITANCE_METHOD_LABEL="Ereditarietà della configurazione"
COM_JOOMGALLERY_CONFIG_INHERITANCE_METHOD_DESC="In quale ordine vengono applicate le configurazioni?<br />Qual è la gerarchia delle configurazioni?<br /><b>Predefinita:</b><br />Voce di menu > Immagine > Categoria > Configurazione personalizzata > Configurazione globale"
COM_JOOMGALLERY_CONFIG_SETS_DESC="JoomGallery utilizza un proprio metodo per organizzare e definire le configurazioni. Apri gli <a target=\"_blank\" href=\"index.php?option=com_joomgallery&view=configs\">insiemi di configurazione</a> per configurare il componente."
COM_JOOMGALLERY_CONFIG_TYPEPARAMS_INFO="Il parametro globale corrente viene calcolato in base all'<a target=\"_blank\" href=\"index.php?option=com_config&view=component&component=com_joomgallery\">ereditarietà della configurazione</a> scelta e all'<a target=\" _blank\" href=\"index.php?option=com_joomgallery&view=configs\">insieme di configurazione</a> assegnato all'utente corrente.<br />Il valore effettivamente applicato potrebbe essere diverso!"
