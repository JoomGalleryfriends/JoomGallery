COM_JOOMGALLERY_FIELDS_PASSWORD_DESC="Qui puoi specificare una password per la categoria.{tip}In questo modo, la categoria sarà accessibile solo agli utenti frontend se immettono la password corretta. Tieni presente che la limitazione dell'accesso tramite livelli di accesso è più severa, il che significa che gli utenti non possono accedere a categorie con un livello di accesso troppo alto anche se conoscono la password corrispondente."
COM_JOOMGALLERY_FIELDS_HIDDEN_DESC="Nascondendo questo elemento, non verrà più mostrato nella vista delle categorie, ma resterà accessibile tramite un collegamento diretto.{tip}<b>Ricorda</b> che \"nascondere\" un elemento non lo protegge dall'accesso. Per renderlo inaccessibile, annullane la pubblicazione.<br />Puoi anche gestire alcune immagini nella galleria senza mostrarle: ad esempio, puoi usare la galleria per gestire immagini inserite negli articoli oppure mostrare un'immagine come miniatura di una categoria senza farla comparire nella vista delle categorie."
COM_JOOMGALLERY_FIELDS_CATEGORY_HIDDEN_DESC="Nascondendo questa categoria, non verrà più mostrata nella galleria o nella vista delle categorie, ma resterà accessibile tramite un collegamento diretto.{tip}<b>Ricorda</b> che \"nascondere\" una categoria non la protegge dall'accesso. Per renderla inaccessibile, annullane la pubblicazione.<br />Le categorie nascoste consentono, ad esempio, di creare aree separate nella galleria. Per accedervi, crea una voce di menu per le categorie nascoste."
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_SEARCH="Escludere dalla ricerca"
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_SEARCH_DESC="Attivando questa opzione è possibile escludere questo articolo dalla ricerca.{tip}Si tenga presente che questa opzione non viene passata automaticamente alle sottocategorie. Naturalmente, abilitare questa opzione potrebbe confondere i visitatori del tuo sito perché alcune immagini non appariranno nei risultati di ricerca anche se inseriscono le parole chiave corrette."
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_TOPLISTS="Escludi dalle classifiche"
COM_JOOMGALLERY_FIELDS_EXCLUDE_FROM_TOPLISTS_DESC="Questa opzione esclude l'elemento dalle classifiche.{tip}L'impostazione non viene ereditata automaticamente dalle sottocategorie. L'esclusione altera le classifiche e i visitatori del sito potrebbero accorgersene."
COM_JOOMGALLERY_FIELDS_THUMBNAIL_DESC="Qui è possibile selezionare un'immagine che è definita come miniatura di questo elemento."
COM_JOOMGALLERY_FIELDS_RESIZING_DESC="Ridimensionare le immagini? Se abiliti il ridimensionamento delle immagini, tutte le immagini caricate verranno ridimensionate alle dimensioni massime specificate (impostazione sotto).{tip}Si consiglia di utilizzare il ridimensionamento delle immagini per i tipi di immagine \"miniatura\" e \"dettaglio\" per evitare problemi di visualizzazione. Se la funzione rimane disabilitata, le immagini verranno visualizzate nella dimensione in cui sono state caricate."
COM_JOOMGALLERY_FIELDS_WATERMARK_DESC="Percorso del file della filigrana, situato sul tuo server. Il percorso deve essere specificato, anche se non si utilizza la funzione filigrana."
COM_JOOMGALLERY_FIELDS_TAG_DESC="Aggiungere i tag e assegnarli all'elemento."
COM_JOOMGALLERY_FIELDS_SELECT_IMAGE="Selezionare un'immagine"
COM_JOOMGALLERY_FIELDS_SELECT_CATEGORY="Scegliere una categoria"
COM_JOOMGALLERY_FIELDS_SELECT_OWNER="- Selezionare il proprietario -"
COM_JOOMGALLERY_FIELDS_DEBUG_MODE_DESC="Con la modalità debug attivata, verranno visualizzate tutte le fasi di elaborazione. Se sei amministratore o in caso di errori vengono sempre visualizzati."
COM_JOOMGALLERY_FIELDS_NUMBERING_START="Inizio della numerazione"
COM_JOOMGALLERY_FIELDS_NUMBERING_START_DESC="Iniziare a numerare le immagini con il seguente valore."
COM_JOOMGALLERY_FIELDS_REPLACE_IMAGETYPE_DESC="Selezionare il tipo di immagine da sostituire."
COM_JOOMGALLERY_FIELDS_REPLACE_IMAGETYPE_PROCESS_DESC="Accettare di elaborare l'immagine prima della sostituzione (ridimensionamento, filigrana, ecc.)."
COM_JOOMGALLERY_FIELDS_REMOVE_PASSWORD_LABEL="Eliminare la password"
COM_JOOMGALLERY_FIELDS_REMOVE_PASSWORD_DESC="Per rimuovere una password esistente, impostare \"Rimuovi password\" su \"Sì\" e salvare la categoria."

