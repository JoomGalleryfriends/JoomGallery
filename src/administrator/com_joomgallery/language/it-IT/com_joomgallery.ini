COM_JOOMGALLERY_CONFIG_MS_UPLOAD_TYPE_LONG="Come vuoi inviare messaggi riguardanti nuove immagini?"
COM_JOOMGALLERY_CONFIG_MS_UPLOAD_RECIPIENTS="Destinatari dei messaggi di caricamento"
COM_JOOMGALLERY_CONFIG_MS_UPLOAD_RECIPIENTS_LONG="A chi vuoi inviare messaggi relativi alle nuove immagini? Se selezioni '-Destinatari predefiniti-' qui e l'invio di messaggi è abilitato sopra, tutti gli utenti che hanno impostato 'Ricevi e-mail di sistema' su 'Sì' nelle impostazioni utente Joomla riceveranno un messaggio di notifica."
COM_JOOMGALLERY_CONFIG_MS_DOWNLOAD_TYPE="Metodo di invio del messaggio di download"
COM_JOOMGALLERY_CONFIG_MS_DOWNLOAD_TYPE_LONG="Come vuoi inviare messaggi riguardanti i download di immagini?"
COM_JOOMGALLERY_CONFIG_MS_DOWNLOAD_RECIPIENTS="Destinatari dei messaggi di download"
COM_JOOMGALLERY_CONFIG_MS_DOWNLOAD_RECIPIENTS_LONG="A chi vuoi inviare messaggi riguardanti il download di immagini? Se selezioni '-Destinatari predefiniti-' qui e l'invio di messaggi è abilitato sopra, tutti gli utenti che hanno impostato 'Ricevi e-mail di sistema' su 'Sì' nelle impostazioni utente Joomla riceveranno un messaggio di notifica."
COM_JOOMGALLERY_CONFIG_MS_ZIPDOWNLOAD="Messaggi per il download di ZIP"
COM_JOOMGALLERY_CONFIG_MS_ZIPDOWNLOAD_LONG="Se questa opzione è attivata, i destinatari dei messaggi di download riceveranno messaggi anche sugli zip scaricati."
COM_JOOMGALLERY_CONFIG_MS_COMMENT_TYPE="Modalità di invio di messaggi di commento"
COM_JOOMGALLERY_CONFIG_MS_COMMENT_TYPE_LONG="Come vuoi inviare messaggi riguardanti nuovi commenti?"
COM_JOOMGALLERY_CONFIG_MS_COMMENT_RECIPIENTS="Destinatari dei messaggi di commento"
COM_JOOMGALLERY_CONFIG_MS_COMMENT_RECIPIENTS_LONG="A chi vuoi inviare messaggi riguardanti nuovi commenti? Questo messaggio verrà inviato solo se è richiesta l'approvazione del commento. Se selezioni '-Destinatari predefiniti-' qui e l'invio di messaggi è abilitato sopra, tutti gli utenti che hanno impostato 'Ricevi e-mail di sistema' su 'Sì' nelle impostazioni utente Joomla riceveranno un messaggio di notifica. Se desideri inviare messaggi solo ai proprietari dell'immagine, seleziona '- Nessun utente -' e seleziona 'Sì' l'opzione sottostante."
COM_JOOMGALLERY_CONFIG_MS_COMMENT_TOOWNER="Messaggio per il proprietario dell'immagine"
COM_JOOMGALLERY_CONFIG_MS_COMMENT_TOOWNER_LONG="Se questa opzione è attivata, anche l'utente proprietario dell'immagine commentata riceverà un messaggio di notifica. Verrà inviato un messaggio anche se non è richiesta l'approvazione del commento. Se devono essere approvati, il messaggio non verrà inviato finché questa operazione non sarà completata."
COM_JOOMGALLERY_CONFIG_MS_REPORT_TYPE="Modalità di invio dei messaggi di segnalazione delle immagini"
COM_JOOMGALLERY_CONFIG_MS_REPORT_TYPE_LONG="Come vuoi inviare i messaggi relativi alle segnalazioni? Questa opzione <b>deve essere attivata</b> per abilitare il pulsante di segnalazione delle immagini."
COM_JOOMGALLERY_CONFIG_MS_REPORT_RECIPIENTS="Destinatari delle segnalazioni delle immagini"
COM_JOOMGALLERY_CONFIG_MS_REPORT_RECIPIENTS_LONG="A chi vuoi inviare i messaggi relativi alle segnalazioni delle immagini? Se scegli '- Destinatari predefiniti -' e l'invio dei messaggi è attivato nella categoria o nella vista dettagliata, riceveranno una notifica tutti gli utenti che hanno impostato 'Ricevi email di sistema' su 'Sì' nelle impostazioni utente di Joomla."
COM_JOOMGALLERY_CONFIG_MS_REPORT_TOOWNER="Messaggio al proprietario dell'immagine (segnalazioni)"
COM_JOOMGALLERY_CONFIG_MS_REPORT_TOOWNER_LONG="Se questa opzione è attivata, anche l'utente proprietario dell'immagine segnalata riceverà un messaggio di notifica."
COM_JOOMGALLERY_CONFIG_MS_REJECTIMG_TYPE="Metodo per inviare messaggi di rifiuto delle immagini"
COM_JOOMGALLERY_CONFIG_MS_REJECTIMG_TYPE_LONG="Come vuoi inviare messaggi sul motivo del rifiuto dell'immagine? Il messaggio verrà inviato solo se compili il campo corrispondente rifiutando un'immagine in Immagini."
COM_JOOMGALLERY_CONFIG_GS_MS_GLOBAL_FROM="Nascondere le informazioni sul mittente"
COM_JOOMGALLERY_CONFIG_GS_MS_GLOBAL_FROM_LONG="Nascondi le informazioni del mittente (nome utente, nome, indirizzo).{tip}Per proteggere la riservatezza dei tuoi utenti, puoi nascondere l'identità dei tuoi mittenti. Se questa opzione è abilitata, l'indirizzo email e il nome immessi nella configurazione globale di Joomla! verrà utilizzato invece."
COM_JOOMGALLERY_CONFIG_USERSPACE="Attivare lo spazio utente"
COM_JOOMGALLERY_CONFIG_USERSPACE_LONG="Lo spazio utente è il pannello di gestione degli utenti del sito.{tip}In base alle impostazioni seguenti, gli utenti possono caricare, eliminare o modificare immagini e creare o eliminare categorie. Le immagini caricate sono mostrate in una tabella. Gli utenti autorizzati a caricare immagini in più categorie possono anche spostarle tra le categorie.<br />Scegli se consentire agli utenti di caricare immagini o creare categorie.<br /><b>In caso contrario, le opzioni seguenti e le impostazioni del pannello utente in <i>Impostazioni frontend</i> verranno ignorate.</b>"
COM_JOOMGALLERY_CONFIG_ADMIN_APPROVAL="Approvazione dell'amministratore"
COM_JOOMGALLERY_CONFIG_ADMIN_APPROVAL_LONG="Se il valore è 'Sì', le immagini devono essere approvate prima di essere pubblicate da un amministratore. In caso contrario verranno approvati e pubblicati automaticamente"
COM_JOOMGALLERY_CONFIG_MAX_USERCATS="Numero massimo di categorie utente"
COM_JOOMGALLERY_CONFIG_MAX_USERCATS_LONG="Quante categorie è autorizzato a creare un utente front-end?"
COM_JOOMGALLERY_CONFIG_MAX_USERIMGS="Numero massimo di immagini utente"
COM_JOOMGALLERY_CONFIG_MAX_USERIMGS_LONG="Quante immagini può caricare un utente dal sito?{tip}Una volta raggiunto il limite, l'utente verrà avvisato e il caricamento verrà sospeso."
COM_JOOMGALLERY_CONFIG_MAX_USERIMGS_TIMESPAN="Intervallo in giorni"
COM_JOOMGALLERY_CONFIG_MAX_USERIMGS_TIMESPAN_LONG="Puoi definire un periodo in <b>giorni</b> durante il quale è consentito caricare il numero massimo di immagini.{tip}Se il valore è 0, il parametro precedente viene considerato un limite assoluto."
COM_JOOMGALLERY_CONFIG_MAX_FILESIZE="Dimensione massima del file"
COM_JOOMGALLERY_CONFIG_MAX_FILESIZE_LONG="Dimensione massima del file in byte consentita per i caricamenti di immagini sul frontend.{tip}Questa impostazione si applica solo al frontend e non ha alcun impatto sui caricamenti sul backend!"
COM_JOOMGALLERY_CONFIG_COPYRIGHT_NOTE="Mostra l'avviso sul copyright"
COM_JOOMGALLERY_CONFIG_COPYRIGHT_NOTE_LONG="Vuoi mostrare un avviso sul copyright nel modulo di caricamento?{tip}L'avviso informa l'utente che le immagini caricate non devono violare diritti di terzi. Puoi personalizzarne il contenuto modificando la costante del sito COM_JOOMGALLERY_UPLOAD_NEW_IMAGE_COPYRIGHT.<br /><b>NOTA!! L'avviso sul copyright predefinito nella costante indicata è soltanto un esempio. Per redigere l'avviso adatto al tuo caso, è necessario richiedere una consulenza legale!</b>"
COM_JOOMGALLERY_CONFIG_DEFAULT_CAT="Categoria di caricamento predefinita"
COM_JOOMGALLERY_CONFIG_DEFAULT_CAT_LONG="Puoi selezionare una categoria predefinita per i caricamenti degli utenti. Il campo Categoria del modulo di caricamento verrà precompilato con questo valore.{tip}Puoi scegliere la categoria più vecchia o più recente creata dall'utente, oppure la più vecchia o più recente tra tutte le categorie in cui l'utente è autorizzato a caricare immagini. Se scegli 'Nessuna', il campo Categoria sarà vuoto per impostazione predefinita.<br /><br /><strong>Questa opzione ha effetto solo se l'opzione <i>Impostazioni generali &raquo; Funzioni aggiuntive &raquo; Disattiva i controlli non necessari</i> <u>non</u> è attivata!</strong>"
COM_JOOMGALLERY_CONFIG_DEFAULT_CAT_NEWEST_ALL="La più recente tra tutte"
COM_JOOMGALLERY_CONFIG_DEFAULT_CAT_NEWEST_OWN="La più recente tra le proprie"
COM_JOOMGALLERY_CONFIG_DEFAULT_CAT_OLDEST_ALL="La più vecchia tra tutte"
COM_JOOMGALLERY_CONFIG_DEFAULT_CAT_OLDEST_OWN="La più vecchia tra le proprie"
COM_JOOMGALLERY_CONFIG_UPLOAD_QUOTA="Mostra i limiti di caricamento"
COM_JOOMGALLERY_CONFIG_UPLOAD_QUOTA_LONG="Desideri visualizzare un avviso sulla dimensione massima di caricamento e sulla quantità di immagini?"
COM_JOOMGALLERY_CONFIG_FRONTEND_UPLOAD="Caricamento frontend"
COM_JOOMGALLERY_CONFIG_FRONTEND_UPLOAD_LONG="Abilitare questa opzione se gli utenti frontend devono essere in grado di caricare immagini"
COM_JOOMGALLERY_CONFIG_PROBLEMATIC_FILES_UPLOAD="Offrire l'opzione 'File immagine problematici'"
COM_JOOMGALLERY_CONFIG_PROBLEMATIC_FILES_UPLOAD_LONG="Consentire il caricamento senza ridimensionamento?{tip}A seconda della configurazione del server, il caricamento di alcune immagini potrebbe generare errori dovuti a memoria insufficiente, librerie mancanti, errori nel codice, configurazioni errate o altre cause. Questa opzione consente agli utenti di caricare immagini potenzialmente problematiche senza ridimensionarle, anche se il ridimensionamento è attivato. Nella vista dettagliata saranno mostrate alle dimensioni originali. Sul sito viene mostrata una casella di selezione con ulteriori spiegazioni."
COM_JOOMGALLERY_CONFIG_REDIRECT_AFTER_UPLOAD="Reindirizzamento dopo il caricamento"
COM_JOOMGALLERY_CONFIG_REDIRECT_AFTER_UPLOAD_LONG="Vuoi reindirizzare l'utente dal frontend dopo aver caricato con successo l'immagine?{tip}Se questa opzione è abilitata, l'utente verrà reindirizzato alla pagina selezionata. Tutte le informazioni di caricamento e debug verranno visualizzate lì.<br />In altri casi, l'utente rimarrà nella pagina di caricamento e queste informazioni verranno visualizzate nel modulo, insieme ai collegamenti per tornare al pannello utente."
COM_JOOMGALLERY_CONFIG_REDIRECT_AFTER_UPLOAD_TO_GALLERY_VIEW="Alla vista della galleria"
COM_JOOMGALLERY_CONFIG_REDIRECT_AFTER_UPLOAD_TO_UPLOAD_VIEW="Alla vista di caricamento"
COM_JOOMGALLERY_CONFIG_REDIRECT_AFTER_UPLOAD_TO_USERPANEL="Al pannello utente"
COM_JOOMGALLERY_CONFIG_DOWNLOAD="Consentire i download"
COM_JOOMGALLERY_CONFIG_DOWNLOAD_LONG="Vuoi consentire il download mostrando il relativo pulsante nelle diverse viste?{tip}Attivando questa opzione, verranno mostrate ulteriori impostazioni per il download."
COM_JOOMGALLERY_CONFIG_DOWNLOADFILE="Scaricare immagini"
COM_JOOMGALLERY_CONFIG_DOWNLOADFILE_LONG="Quale immagine vuoi rendere disponibile per il download?{tip}\"Dettaglio\" scarica l'immagine della vista dettagliata. \"Originale\" scarica l'immagine originale, visualizzata nella finestra popup.<br />Questa impostazione funziona solo se i download sono abilitati."
COM_JOOMGALLERY_CONFIG_DOWNLOADWITHWATERMARK="Scaricare con filigrana?"
COM_JOOMGALLERY_CONFIG_DOWNLOADWITHWATERMARK_LONG="Vuoi aggiungere una filigrana all'immagine scaricata?{tip}Scegliendo \"Sì\" si aggiungerà una filigrana all'immagine scaricata, indipendentemente dal fatto che una filigrana venga visualizzata o meno nella vista dettagliata."
COM_JOOMGALLERY_CONFIG_RATING="Consenti valutazioni"
COM_JOOMGALLERY_CONFIG_RATING_LONG="Questa opzione mostra un campo di valutazione nella vista dettagliata della galleria e consente agli utenti di valutare le immagini.{tip}Attivandola, verranno mostrate ulteriori impostazioni per le valutazioni."
COM_JOOMGALLERY_CONFIG_RATING_CAT_LONG="Qui è possibile impostare se la valutazione è consentita in questa categoria.{tip}Ciò potrebbe sovrascrivere l'impostazione nella scheda \"Diritti di accesso utente->Voti->Consenti valutazione\" nella configurazione JoomGallery."
COM_JOOMGALLERY_CONFIG_HIGHEST_RATING="Punteggio più alto"
COM_JOOMGALLERY_CONFIG_HIGHEST_RATING_LONG="Se le valutazioni utente sono abilitate (impostazione sopra), è possibile specificare un intervallo di numeri qui.{tip}Il valore immesso è il valore più alto possibile consentito."
COM_JOOMGALLERY_CONFIG_CALC_TYPE="Tipologia di calcolo del voto"
COM_JOOMGALLERY_CONFIG_CALC_TYPE_BAYES1="Ponderato (Bayes)"
COM_JOOMGALLERY_CONFIG_CALC_TYPE_LONG="Scegliere il tipo di calcolo del punteggio medio.{tip}Se si utilizza il tipo standard, il punteggio verrà calcolato costruendo la media aritmetica. Se utilizzi il tipo ponderato di <a href=\"http://en.wikipedia.org/wiki/Thomas_Bayes\" target=\"_blank\">Thomas Bayes</a>, nel calcolo viene preso in considerazione il numero totale di voti per tutte le immagini. Pertanto, meno voti per un'immagine saranno considerati meno credibili di più voti."
COM_JOOMGALLERY_CONFIG_CALC_TYPE_STANDARD="Standard"
COM_JOOMGALLERY_CONFIG_VOTING_ONLY_ONCE="Un voto per immagine"
COM_JOOMGALLERY_CONFIG_VOTING_ONLY_ONCE_LONG="Limite a un voto per immagine?{tip}Questo creerà un blocco IP per 24 ore. <strong>Nota</strong> che questa non è una protezione affidabile contro i voti multipli. Gli utenti possono facilmente ottenere un nuovo indirizzo IP. Per risultati di votazione affidabili, dovresti consentire il voto solo agli utenti registrati."
COM_JOOMGALLERY_CONFIG_REPORT_IMAGES="Consenti segnalazioni"
COM_JOOMGALLERY_CONFIG_REPORT_IMAGES_LONG="Attiva questa opzione per consentire agli utenti di segnalare le immagini della galleria.{tip}<b>Nota</b> che l'opzione in Impostazioni generali » Modalità di invio dei messaggi di segnalazione delle immagini » deve essere diversa da Nessuna.<br />Il pulsante di segnalazione deve essere mostrato in almeno una vista: controlla le impostazioni di visualizzazione dei pulsanti nelle schede corrispondenti della configurazione."
COM_JOOMGALLERY_CONFIG_HINT_NOT_ENOUGH_RIGHTS="Consigli se i diritti non sono sufficienti"
COM_JOOMGALLERY_CONFIG_REPORT_HINT_LONG="Se abilitato, verrà visualizzato un suggerimento per gli utenti senza diritti sufficienti, indicando che la segnalazione di immagini è possibile solo con le autorizzazioni appropriate."
COM_JOOMGALLERY_CONFIG_DOWNLOAD_HINT_LONG="Se attivata, mostra agli utenti con diritti insufficienti un avviso che indica che il download delle immagini richiede le autorizzazioni appropriate."
COM_JOOMGALLERY_CONFIG_EDIT_ONLY_IN_GLOBAL="Questo parametro può essere modificato solo nella Configurazione Globale."
COM_JOOMGALLERY_CONFIG_GD2_FASTDOWNSIZE="Riduzione dell'immagine più rapida"
COM_JOOMGALLERY_CONFIG_GD2_FASTDOWNSIZE_LONG="Funzione ottimizzata per il ridimensionamento delle immagini.{tip}Consente di ridurre le immagini molto più velocemente, abbreviando il tempo di esecuzione dello script di caricamento, ma richiede quattro volte più memoria rispetto all'opzione più lenta. Non attivarla se la memoria disponibile è limitata."
COM_JOOMGALLERY_CONFIG_DETAIL_WHEN_NO_ORIGINAL="Dettagli se l'originale non è disponibile"
COM_JOOMGALLERY_CONFIG_IMAGETYPES="Tipi di immagini supportati"
COM_JOOMGALLERY_CONFIG_IMAGETYPES_LONG="Elenca qui i tipi di file immagine supportati come elenco di estensioni file separate da virgole.{tip}Esempio: jpg, jpeg, png, gif, webp"
COM_JOOMGALLERY_CONFIG_PARALLEL_PROCESS="Numero di processi paralleli"
COM_JOOMGALLERY_CONFIG_PARALLEL_PROCESS_LONG="Numero di processi paralleli per il salvataggio delle immagini.{tip}Valori più elevati velocizzano il caricamento multiplo perché consentono di salvare più immagini contemporaneamente, ma richiedono maggiori risorse del server. Usa un valore superiore a uno soltanto se disponi di un server sufficientemente potente."
COM_JOOMGALLERY_CONFIG_COMMENT="Consenti commenti"
COM_JOOMGALLERY_CONFIG_COMMENT_LONG="Questa opzione visualizza un campo commento nella vista dettagliata della galleria che mostra i commenti forniti.{tip}La versione corrente di JoomGallery non supporta i commenti. Ma i commenti già forniti verranno visualizzati se questa opzione è abilitata."
COM_JOOMGALLERY_CONFIG_COMMENT_CAT_LONG="Qui puoi impostare se i commenti sono consentiti in questa categoria.{tip}Ciò potrebbe sovrascrivere l'impostazione nella scheda \"Diritti di accesso utente->Commenti->Consenti commenti\" nella configurazione JoomGallery."
COM_JOOMGALLERY_CONFIG_STATIC_PROCESS_ORIGINAL_LONG="Le modifiche definite qui vengono applicate in modo permanente all'immagine originale. Non sarà più possibile ripristinare l'immagine allo stato iniziale. Poiché l'originale viene usato come sorgente per la (ri)generazione delle immagini, queste impostazioni influiscono anche su tutti gli altri tipi di immagine.<br /><strong>Ad esempio:</strong><br />Una filigrana applicata qui comparirà automaticamente anche su tutti gli altri tipi di immagine, oltre alle modifiche definite per ciascun tipo."
