COM_JOOMGALLERY_CONFIG_DYNAMIC_WATERMARK="Filigrana dinamica"
COM_JOOMGALLERY_CONFIG_DYNAMIC_WATERMARK_LONG="Disattiva globalmente la filigrana per tutti i tipi di immagine.{tip} Se si desidera una filigrana dinamica, è necessario attivare e configurare inoltre la filigrana dinamica per ciascun tipo di immagine."
