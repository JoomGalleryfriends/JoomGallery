COM_JOOMGALLERY_CONFIG_TARGET_IMAGE_FIELD="Campo Immagine di destinazione"
COM_JOOMGALLERY_CONFIG_TARGET_IMAGE_FIELD_LONG="Campo immagine che deve contenere i metadati."
COM_JOOMGALLERY_CONFIG_SOURCE_METADATA_FIELD="Campo metadati di origine"
COM_JOOMGALLERY_CONFIG_SOURCE_METADATA_FIELD_LONG="Campo di metadati che deve essere utilizzato come fonte di dati."
