COM_JOOMGALLERY_CONFIG_IMPORT_FILE="Importare un set di configurazione"
COM_JOOMGALLERY_CONFIG_SENSITIVE_FIELD="Parametri sensibili. Modifiche consigliate solo agli utenti esperti!"
COM_JOOMGALLERY_CONFIG_ALERT_ENABLE_SENSITIVE_FIELD="\"Attenzione - Parametro per utenti esperti\n--------------------------------------------------------- \nQuesto parametro ha conseguenze rilevanti sul funzionamento del componente. Modificalo soltanto se sai cosa stai facendo.\n\nContinuare?"
COM_JOOMGALLERY_CONFIG_IMPORT_FILE_LBL="File di configurazione"
COM_JOOMGALLERY_CONFIG_IMPORT_FILE_DESC="Scegliere un file json contenente un set di configurazione da applicare qui"
COM_JOOMGALLERY_CONFIG_RESET="Ripristina le opzioni"
COM_JOOMGALLERY_CONFIG_RESET_CONFIRM="Sei sicuro di voler ripristinare le impostazioni di fabbrica?"
COM_JOOMGALLERY_CONFIG_ADD_WATERMARK="Aggiungere una filigrana?"
COM_JOOMGALLERY_CONFIG_ADD_WATERMARK_IMG_LONG="Vuoi aggiungere una filigrana all'immagine?{tip}Per impostazione predefinita, il file grafico della filigrana si trova in \"media/joomgallery/images/\" con il nome file watermark.png. È possibile modificare il percorso e il nome del file selezionando un altro file in <i>Impostazioni generali » Elaborazione immagine » Filigrana</i>."
COM_JOOMGALLERY_CONFIG_SHOW_EXIFDATA="Visualizzare i dati Exif?"
COM_JOOMGALLERY_CONFIG_SHOW_EXIFDATA_IMG_LONG="Mostrare i dati Exif dell'immagine, se disponibili?{tip}Se scegli \"Sì\", puoi usare le opzioni seguenti per decidere quali informazioni pubblicare. Altrimenti queste opzioni non avranno effetto."
COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING="Mostrare la mappa?"
COM_JOOMGALLERY_CONFIG_SHOW_GEOTAGGING_IMG_LONG="Desideri aggiungere una mappa che mostri dove è stata scattata l'immagine? {tip} È possibile utilizzare i dati GPS dell'immagine originale per visualizzarli come posizione su una mappa. Se l'immagine contiene dati GPS validi nelle informazioni Exif, nella visualizzazione dettagliata verrà visualizzata un'area aggiuntiva con la mappa."
COM_JOOMGALLERY_CONFIG_SHOW_IPTCDATA="Visualizzare i dati IPTC?"
COM_JOOMGALLERY_CONFIG_SHOW_IPTCDATA_IMG_LONG="Mostrare i dati IPTC dell'immagine, se disponibili?{tip}Se scegli \"Sì\", puoi usare le opzioni seguenti per decidere quali informazioni pubblicare. Altrimenti queste opzioni non avranno effetto."
COM_JOOMGALLERY_CONFIG_OFFER_DOWNLOAD="Offrire download"
COM_JOOMGALLERY_CONFIG_OFFER_DOWNLOAD_CAT_LONG="Qui è possibile impostare se il download è consentito in questa categoria.{tip}Ciò potrebbe sovrascrivere l'impostazione nella scheda \"Diritti di accesso utente->Download->Offerta download\" nella configurazione JoomGallery."
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK="Aggiungere una filigrana"
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_CAT_LONG="Qui puoi decidere se mostrare la filigrana sulle immagini di dettaglio/originali di questa categoria.{tip}Questa impostazione può prevalere su quella nella scheda 'Vista dettagliata->Impostazioni generali->Aggiungere una filigrana?' della configurazione di JoomGallery."
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_DOWNLOAD="Scarica con filigrana"
COM_JOOMGALLERY_CONFIG_ALLOW_WATERMARK_DOWNLOAD_CAT_LONG="Qui puoi decidere se includere la filigrana nei file scaricati di questa categoria.{tip}Questa impostazione può prevalere su quella nella scheda 'Diritti di accesso utente->Download->Scarica con filigrana?' della configurazione di JoomGallery."
COM_JOOMGALLERY_CONFIG_USER_GROUP="Scegliere un gruppo di utenti"
COM_JOOMGALLERY_CONFIG_USER_GROUP_DESC="Gruppo di utenti a cui si applicano questi parametri"
COM_JOOMGALLERY_CONFIG_IP_STATIC="Elaborazione delle immagini <br /> (immagini statiche)"
COM_JOOMGALLERY_CONFIG_IP_STATIC_DESC="Queste impostazioni determinano come vengono ricreati e salvati i tipi di immagine durante il caricamento.{tip}Se modifichi queste impostazioni, devi ricreare i tipi di immagine delle immagini esistenti per applicare le modifiche."
COM_JOOMGALLERY_CONFIG_IP_DYNAMIC="Elaborazione delle immagini <br /> (immagini dinamiche)"
COM_JOOMGALLERY_CONFIG_IP_DYNAMIC_DESC="Queste impostazioni determinano se i tipi di immagine mostrati sul sito vengono modificati dinamicamente durante l'esecuzione.{tip}Questo consente di mostrare le immagini in base alle autorizzazioni dell'utente corrente. <strong>Attenzione:</strong> Queste impostazioni incidono notevolmente sulle prestazioni del sito."
COM_JOOMGALLERY_CONFIG_IP_ACTIVATE_TYPE="Abilita il tipo di immagine"
COM_JOOMGALLERY_CONFIG_ACTIVATED="Attivato"
