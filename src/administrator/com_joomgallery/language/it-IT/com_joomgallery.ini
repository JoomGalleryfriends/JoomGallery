COM_JOOMGALLERY_CONFIG_IP_TYPE_SHARPEN="Perfeziona la nitidezza dell'immagine"
COM_JOOMGALLERY_CONFIG_IP_TYPE_SHARPEN_LONG="'Sì' per applicare un filtro di nitidezza all'immagine."
COM_JOOMGALLERY_CONFIG_FILESYSTEM="Sistema di file"
COM_JOOMGALLERY_CONFIG_FILESYSTEM_LONG="Posizione per la memorizzazione dei file di immagine."
COM_JOOMGALLERY_CONFIG_FILESYSTEM_LOCALHOST="File system locale"
COM_JOOMGALLERY_CONFIG_FTPUPLOAD_PATH="Percorso di caricamento FTP"
COM_JOOMGALLERY_CONFIG_FTPUPLOAD_PATH_LONG="Percorso della cartella di caricamento FTP. Questa cartella viene utilizzata per i caricamenti FTP.{tip}Le immagini che scegli di aggiungere alla galleria tramite FTP vanno in questa cartella"
COM_JOOMGALLERY_CONFIG_USE_REAL_PATHS="Utilizzare percorsi reali"
COM_JOOMGALLERY_CONFIG_USE_REAL_PATHS_LONG="Se questa opzione è abilitata, le immagini non verranno più generate tramite lo script PHP in modo che i loro percorsi effettivi vengano inviati ai browser.{tip}<b>Si prega di notare</b> che il contatore delle visite non funzionerà con questa impostazione abilitata. Inoltre, i file di immagine non saranno protetti dall'accesso non autorizzato (la loro protezione è ancora possibile, ad esempio tramite htaccess).<br />L'attivazione della filigrana o del \"ridimensionamento dinamico\" in Impostazioni generali » Elaborazione immagine » Elaborazione immagine (immagini dinamiche) nella configurazione globale di JoomGallery annullerà questa impostazione."
COM_JOOMGALLERY_CONFIG_COMPATIBILITY_MODE="Modalità di compatibilità JG3"
COM_JOOMGALLERY_CONFIG_COMPATIBILITY_MODE_LONG="Attivare la modalità di compatibilità per rilevare alcune peculiarità delle versioni precedenti di JoomGallery e garantire così la compatibilità dei contenuti precedenti.{tip}L'attivazione della modalità di compatibilità ridurrà le prestazioni del componente e pertanto non è consigliata. In alcuni casi, però, ciò è necessario per continuare a utilizzare correttamente i vecchi contenuti. Ad esempio: <br /><ul><li> Hai disabilitato \"Utilizza nuova struttura di cartelle\" durante la migrazione. Questa modalità è necessaria per leggere i vecchi percorsi di sistema statici e continuare a utilizzarli.</li></ul>"
COM_JOOMGALLERY_CONFIG_CHECKUPDATE="Controllare gli aggiornamenti?"
COM_JOOMGALLERY_CONFIG_CHECKUPDATE_LONG="Si desidera che la galleria controlli automaticamente gli aggiornamenti ai componenti e alle estensioni?{tip}La galleria che controlla gli aggiornamenti visualizza un feed <a href=\"https://www.en.joomgalleryfriends.net/components/com_newversion/rss/extensions.rss \" target=\"_blank\">RSS</a> fornito su joomgalleryfriends.net."
COM_JOOMGALLERY_CONFIG_REPLACE_METADATA="Utilizza metadati di immagine"
COM_JOOMGALLERY_CONFIG_REPLACE_SHOWWARNING="Mostra avviso"
COM_JOOMGALLERY_CONFIG_REPLACE_SHOWWARNING_LONG="Visualizza un avviso durante il caricamento, se uno qualsiasi dei metadati selezionati sopra non è presente nell'immagine.{tip}Questa impostazione si applica indipendentemente dall'impostazione di debug nel modulo di caricamento.<br />Con suggerimento: oltre agli avvisi, un suggerimento mostrerà all'utente una soluzione al problema."
COM_JOOMGALLERY_CONFIG_REPLACE_SHOWWARNING_HINT="Sì, con un suggerimento"
COM_JOOMGALLERY_CONFIG_ORIGINAL_FILENAME="Nome del file originale"
COM_JOOMGALLERY_CONFIG_ORIGINAL_FILENAME_LONG="Utilizzare il nome del file originale come titolo dell'immagine?"
COM_JOOMGALLERY_CONFIG_UPLOAD_ORDER="Numeri sequenziali"
COM_JOOMGALLERY_CONFIG_UPLOAD_ORDER_LONG="Vuoi assegnare automaticamente numeri d'ordine alle immagini? Quale ordine preferisci?{tip}I numeri d'ordine permettono di controllare la disposizione delle immagini sul sito. Sono memorizzati nel database e possono essere modificati successivamente. L'assegnazione automatica organizza le immagini sul sito e ne facilita la gestione nell'amministrazione. In genere è consigliato l'ordine crescente. Questa impostazione si applica anche ai caricamenti degli utenti dal sito."
COM_JOOMGALLERY_CONFIG_NUMBERING="Numerazione"
COM_JOOMGALLERY_CONFIG_NUMBERING_LONG="Numerare progressivamente le immagini caricate?"
COM_JOOMGALLERY_CONFIG_IMAGEPROCESSOR="Processore di immagini"
COM_JOOMGALLERY_CONFIG_IMAGEPROCESSOR_LONG="Scegli lo strumento per l'elaborazione delle immagini.{tip}È necessario per operazioni come ridimensionamento, ritaglio e applicazione della filigrana e deve essere installato e pronto all'uso sul server.<br /><b>La libreria GD</b > è disponibile sulla maggior parte dei server e dei siti web. Se disponi di <b>ImageMagick</b>, consigliamo di usarlo perché utilizza le risorse del server in modo più efficiente e velocizza il caricamento e l'elaborazione delle immagini."
COM_JOOMGALLERY_CONFIG_GDLIB="Libreria GD"
COM_JOOMGALLERY_CONFIG_GDLIB_VERSION="<strong>La libreria GD è installata e dovrebbe funzionare correttamente.</strong> La versione attualmente installata è: %s."
COM_JOOMGALLERY_CONFIG_GDLIB_MISSING="<strong>La libreria GD non è stata trovata nel sistema.</strong> Assicurarsi che GD sia installato correttamente sul server e che le impostazioni PHP siano corrette."
COM_JOOMGALLERY_CONFIG_IMAGEMAGICK="ImageMagick"
COM_JOOMGALLERY_CONFIG_IMAGEMAGICK_VERSION="<strong>ImageMagick è installato e dovrebbe funzionare correttamente. </strong> La versione attualmente installata è: %s."
COM_JOOMGALLERY_CONFIG_IMAGEMAGICK_MISSING="<strong>ImageMagick non può essere trovato sul sistema.</strong> Verificare che il percorso dell'eseguibile ImageMagick sia configurato correttamente. In caso di dubbi, chiedi al tuo host se ImageMagick è installato. Puoi anche provare la libreria GD."
COM_JOOMGALLERY_CONFIG_PATH_IMAGEMAGICK="Percorso verso ImageMagick"
COM_JOOMGALLERY_CONFIG_PATH_IMAGEMAGICK_LONG="Immettere il percorso di ImageMagick con una barra (/) alla fine"
COM_JOOMGALLERY_CONFIG_METAPROCESSOR="Processore di metadati"
COM_JOOMGALLERY_CONFIG_METAPROCESSOR_LONG="Scegli lo strumento utilizzato per l'elaborazione dei metadati.{tip}Il processore di metadati è necessario per modificare metadati come IPTC, EXIF o XMP. Il processore deve essere installato sul server, pronto per l'uso.<br /><b>PHP</b> è disponibile sulla maggior parte dei server e dei siti web. Se hai a disposizione <b>ExifTools</b>, ti consigliamo di utilizzarlo poiché fornisce molte più funzionalità e ha un supporto migliore per diversi formati di file e produttori di fotocamere."
COM_JOOMGALLERY_CONFIG_METADATA_EXIFTOOLS="ExifTools"
COM_JOOMGALLERY_CONFIG_IMAGETYPE_PATH="Percorso radice"
COM_JOOMGALLERY_CONFIG_IMAGETYPE_PATH_LONG="Immettere il percorso radice di questa immagine.{tip}Senza barra (/) alla fine"
COM_JOOMGALLERY_CONFIG_IMAGE_QUALITY="Qualità"
COM_JOOMGALLERY_CONFIG_IMAGE_QUALITY_LONG="Qualità dell'immagine dopo l'elaborazione.{tip}Il valore inserito (percentuale) specifica la qualità delle immagini ridotte generate - rispetto all'immagine originale. Tieni presente che una qualità superiore richiederà più spazio sul server."
