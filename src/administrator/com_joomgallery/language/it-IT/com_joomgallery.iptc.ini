COM_JOOMGALLERY_IPTC_CITYLEGACY="Città"
COM_JOOMGALLERY_IPTC_CITYLEGACY_DEFINITION="Nome della città su cui si concentra il contenuto: il luogo visualizzato nei media visivi o a cui fanno riferimento i media testuali o audio. Questo elemento si trova al terzo livello di una gerarchia geografica discendente."
COM_JOOMGALLERY_IPTC_CONTACT="Contatto"
COM_JOOMGALLERY_IPTC_CONTACT_DEFINITION="Una struttura generica che fornisce un insieme di informazioni di base per contattare una persona o un'organizzazione."
COM_JOOMGALLERY_IPTC_COPYRIGHTNOTICE="Avviso sul diritto d'autore"
COM_JOOMGALLERY_IPTC_COPYRIGHTNOTICE_DEFINITION="Contiene qualsiasi avviso di copyright necessario per rivendicare la proprietà intellettuale di questo articolo e dovrebbe identificare l'attuale titolare del copyright dell'articolo. Altre entità, come il creatore dell'articolo, possono essere aggiunte nel campo corrispondente. Le note sui diritti di utilizzo devono essere fornite nei \"Termini di utilizzo dei diritti\"."
COM_JOOMGALLERY_IPTC_COUNTRYCODELEGACY="Codice paese"
COM_JOOMGALLERY_IPTC_COUNTRYCODELEGACY_DEFINITION="Codice del paese a cui si riferisce il contenuto: il paese mostrato nei media visivi oppure citato nei media testuali o audio. Questo elemento occupa il primo livello di una gerarchia geografica discendente. Usa un codice ISO 3166 a due o tre lettere. Il nome completo del paese deve essere inserito nell'elemento \"Paese\"."
COM_JOOMGALLERY_IPTC_COUNTRYLEGACY="Paese"
COM_JOOMGALLERY_IPTC_COUNTRYLEGACY_DEFINITION="Nome completo del paese a cui si riferisce il contenuto: il paese mostrato nei media visivi oppure citato nei media testuali o audio. Questo elemento occupa il primo livello, il più alto, della gerarchia geografica discendente. Inserisci il nome completo in forma testuale; il codice deve essere indicato nell'elemento \"Codice paese\"."
COM_JOOMGALLERY_IPTC_CREATOR="Autore"
COM_JOOMGALLERY_IPTC_CREATORSJOBTITLE="Qualifica dell'autore"
COM_JOOMGALLERY_IPTC_CREATORSJOBTITLE_DEFINITION="Contiene la qualifica professionale della persona che ha creato il contenuto. Poiché questa informazione specifica il ruolo dell'autore, il campo Autore deve essere compilato prima di utilizzare questo elemento."
COM_JOOMGALLERY_IPTC_CREATOR_DEFINITION="Contiene il nome della persona che ha creato il contenuto per questo elemento, un fotografo per le foto, un grafico per la grafica o un editore per le notizie di testo, ma nei casi in cui il fotografo non deve essere identificato, il nome di una società o organizzazione può essere appropriato."
COM_JOOMGALLERY_IPTC_CREDITLINE="Crediti"
COM_JOOMGALLERY_IPTC_CREDITLINE_DEFINITION="Indicazione delle persone e/o dell'organizzazione da citare in fase di pubblicazione, secondo le richieste del fornitore del contenuto. È un campo di testo libero."
COM_JOOMGALLERY_IPTC_DATECREATED="Data di creazione"
COM_JOOMGALLERY_IPTC_DATECREATED_DEFINITION="Designa la data di creazione del contenuto intellettuale piuttosto che la data di creazione della rappresentazione fisica."
COM_JOOMGALLERY_IPTC_DESCRIPTION="Didascalia/Riepilogo"
COM_JOOMGALLERY_IPTC_DESCRIPTIONWRITER="Autore/Redattore"
COM_JOOMGALLERY_IPTC_DESCRIPTIONWRITER_DEFINITION="Identificatore o nome della persona che ha partecipato alla scrittura, alla modifica o alla correzione della descrizione del contenuto."
COM_JOOMGALLERY_IPTC_DESCRIPTION_DEFINITION="Una descrizione testuale, comprese le didascalie, del contenuto dell'elemento, particolarmente utilizzata quando l'oggetto non è testo."
COM_JOOMGALLERY_IPTC_HEADLINE="Titolo descrittivo"
COM_JOOMGALLERY_IPTC_HEADLINE_DEFINITION="Un breve riepilogo della didascalia. Il titolo descrittivo non coincide con il titolo."
COM_JOOMGALLERY_IPTC_INSTRUCTIONS="Istruzioni"
COM_JOOMGALLERY_IPTC_INSTRUCTIONS_DEFINITION="Eventuali istruzioni del fornitore o del creatore al destinatario dell'elemento."
COM_JOOMGALLERY_IPTC_INTELLECTUALGENRE="Genere intellettuale"
COM_JOOMGALLERY_IPTC_INTELLECTUALGENRE_DEFINITION="Descrive la natura, le caratteristiche intellettuali, artistiche o giornalistiche di un articolo, e non specificatamente il suo contenuto."
COM_JOOMGALLERY_IPTC_KEYWORDS="Parole chiave"
COM_JOOMGALLERY_IPTC_KEYWORDS_DEFINITION="Parole chiave che esprimono l'argomento del contenuto. Possono essere testo libero e non devono necessariamente provenire da un vocabolario controllato. I codici del vocabolario controllato IPTC Subject NewsCodes devono essere inseriti nel campo \"Codice soggetto\"."
COM_JOOMGALLERY_IPTC_PROVINCEORSTATELEGACY="Provincia/Stato"
COM_JOOMGALLERY_IPTC_PROVINCEORSTATELEGACY_DEFINITION="Nome della sottoregione di un paese - chiamata provincia o stato o qualsiasi altra cosa - su cui si concentra il contenuto - sia la sottoregione visualizzata nei media visivi o a cui fa riferimento il testo o i media audio. Questo elemento si trova al secondo livello di una gerarchia geografica discendente."
COM_JOOMGALLERY_IPTC_SOURCE="Fonte"
COM_JOOMGALLERY_IPTC_SOURCE_DEFINITION="Identifica il proprietario originale del copyright per il contenuto intellettuale dell'elemento. Può trattarsi di un'agenzia, di un membro di un'agenzia o di un individuo. La fonte potrebbe essere diversa dal Creatore e dalle entità indicate nell'avviso di copyright."
COM_JOOMGALLERY_IPTC_SUBLOCATIONLEGACY="Posizione"
COM_JOOMGALLERY_IPTC_SUBLOCATIONLEGACY_DEFINITION="Nome di una posizione secondaria su cui si concentra il contenuto: la posizione visualizzata nei media visivi o a cui fa riferimento il testo o i media audio. Questo nome di località può essere il nome di una località secondaria all'interno di una città oppure il nome di un luogo noto o di un monumento (naturale) fuori città. Nel senso di sublocalizzazione alla città, questo elemento si colloca al quarto livello di una gerarchia geografica discendente."
COM_JOOMGALLERY_IPTC_TIMECREATED="Orario di creazione"
COM_JOOMGALLERY_IPTC_TIMECREATED_DEFINITION="Designa il momento in cui è stato creato il contenuto intellettuale piuttosto che il momento della creazione della rappresentazione fisica. Se non viene specificata l'ora, l'impostazione predefinita dovrebbe essere 00:00:00."
COM_JOOMGALLERY_IPTC_TITLE="Titolo"
COM_JOOMGALLERY_IPTC_TITLE_DEFINITION="Un riferimento abbreviato all'immagine digitale. Il titolo fornisce un nome breve e comprensibile, composto da testo e/o da un riferimento numerico. Non coincide con il titolo descrittivo."
COM_JOOMGALLERY_IPTC_ERROR_UNKNOWN_CHARSET="Codifica del set di caratteri sconosciuta trovata nel tag IPTC 1:90"
COM_JOOMGALLERY_IPTC_ERROR_CONVERT_CHARSET="Errore di conversione del set di caratteri codifica IPTC da %s a UTF-8"
COM_JOOMGALLERY_IPTC_TRANSMISSIONREFERENCE="Riferimento di trasmissione originale"

