FILES_JOOMGALLERY_MIGRATION_CHECK_IMAGE_FILENAMES_TITLE="Nomi dei file di immagine"
FILES_JOOMGALLERY_MIGRATION_CHECK_IMAGE_FILENAMES_DESC="Esistono diversi nomi di file per le miniature e le immagini di dettaglio definite nel database delle vostre tabelle JG3. Numero di immagini interessate: %s"
FILES_JOOMGALLERY_MIGRATION_CHECK_IMAGE_FILENAMES_HELP="Per alcune immagini nella tabella del database JG3 (origine, #__com_joomgallery) sono stati rilevati nomi di file diversi nei campi 'imgfilename' e 'imgthumbname'. Questo potrebbe causare risultati errati durante la migrazione. Si consiglia vivamente di correggere manualmente il database prima di avviare la migrazione. Per ogni immagine interessata, procedi così:<ul><li>Rinomina il file della miniatura nel file system usando il nome indicato nella vecchia tabella delle immagini di JoomGallery, nel campo 'imgfilename'.</li><li>Nella vecchia tabella delle immagini di JoomGallery, imposta il campo 'imgthumbname' allo stesso valore del campo 'imgfilename'.</li></ul><br/>ID delle immagini interessate: (%s)"
FILES_JOOMGALLERY_MIGRATION_ERROR_TYPE_PREREQUIREMENT="I prerequisiti per questo tipo di contenuto non sono soddisfatti. Assicurati che la migrazione dei seguenti tipi di contenuto sia stata completata e che nessuno di essi abbia avuto esito negativo."
FILES_JOOMGALLERY_SERVICE_MIGRATION_DIRECT_USAGE_ERROR="Non è possibile usare direttamente le immagini se l'origine si trova al di fuori di questa installazione di Joomla!. Al passaggio 1 non puoi impostare contemporaneamente 'Stessa installazione Joomla!' su sì e 'Utilizzo delle immagini' su 'Uso diretto'."
FILES_JOOMGALLERY_SERVICE_MIGRATION_DIRECT_USAGE_IMGTYPES_ERROR="L'uso diretto delle immagini è possibile solo con i tre tipi di immagine predefiniti (originale, dettaglio, miniatura) abilitati. Rimuovi tutti gli altri tipi di immagine dalla configurazione JoomGallery."
FILES_JOOMGALLERY_SERVICE_MIGRATION_DIRECT_USAGE_LOCAL_ERROR="L'uso diretto delle immagini è possibile solo quando si utilizza il file system locale. Passare al file system locale nella configurazione JoomGallery se si desidera utilizzare l'uso diretto."
FILES_JOOMGALLERY_SERVICE_MIGRATION_DIRECT_USAGE_ORIGINAL_WARNING="Hai scelto l'uso diretto delle immagini nel passaggio 1. Assicurati che il tipo di immagine 'originale' sia disabilitato se era disabilitato nella tua versione sorgente/precedente di Joomla."
FILES_JOOMGALLERY_MIGRATION_CHECK_CATEGORY_CATPATH="Percorso delle categorie"
FILES_JOOMGALLERY_MIGRATION_CHECK_CATEGORY_CATPATH_DESC="Sono presenti percorsi di cartelle di categoria incoerenti definiti nel database per le tabelle JG3. Modifica manualmente i percorsi delle categorie assegnati o disattiva \"Utilizza nuova struttura di cartelle\" nel passaggio 1 per utilizzare invece il vecchio percorso statico"
FILES_JOOMGALLERY_MIGRATION_CHECK_CATEGORY_CATPATH_HELP="Alcune categorie nella tabella del database JG3 (origine, #__com_joomgallery_catg) presentano dati incoerenti per cid, nome, alias e catpath. La causa è un errore delle versioni precedenti di JoomGallery, corretto in JoomGallery v3.7.0. L'incoerenza si verificava rinominando o spostando le categorie senza svuotare il campo alias e impedisce la migrazione alla nuova struttura delle cartelle senza attivare la modalità di compatibilità.<br /><br />Esistono due soluzioni:<ul><li>Correggere manualmente il database di origine oppure usare il gestore di manutenzione di JoomGallery v3.7.0. (consigliato)</li><li>Disattivare 'Usa una nuova struttura di cartelle' nelle opzioni di migrazione e attivare la 'Modalità di compatibilità JG3' nella configurazione del componente. (sconsigliato)</li></ul>Si consiglia vivamente di correggere il database prima della migrazione. In questo modo JoomGallery potrà essere migrato alla nuova struttura, coerente con quella di Joomla, evitando errori e comportamenti anomali.<br /><br />Una tabella delle categorie JG3 coerente (#__com_joomgallery_catg) soddisfa le condizioni seguenti:<ul><li><strong>alias = parentalias/title</strong><br />dove il titolo viene convertito in una stringa adatta agli URL (lettere minuscole, nessun carattere speciale o dieresi, nessuno spazio, ...)</li><li><strong>path = parentpath/title_cid</strong><br />dove il titolo viene convertito come per l'alias e cid è l'identificatore della categoria.</li></ul><br/>IDs delle categorie interessate: (%s)"
FILES_JOOMGALLERY_FIELDS_NEW_DIRS_LABEL="Utilizza una nuova struttura di directory"
FILES_JOOMGALLERY_FIELDS_NEW_DIRS_DESC="Vuoi convertire le categorie migrate alla nuova struttura delle cartelle del file system?{tip}<strong>Nuova struttura dei percorsi (JG4+):</strong> root-of-filesystem/joomgallery/imagetype/parent-category-path /alias/<br /><strong>Vecchia struttura dei percorsi (JG3-):</strong> joomla-root/images/joomgallery/imagetype/parent-category-path/name_cid/<br />In JG3-, nella maggior parte dei casi, l'alias può essere ricavato dal nome della categoria. Questo può produrre risultati errati se i titoli delle categorie sono stati rinominati senza rigenerare l'alias. In tal caso, non è possibile convertire la vecchia struttura JG3- in quella nuova.<br />Se scegli di mantenere la vecchia struttura delle cartelle, devi attivare la 'Modalità di compatibilità JG3' nella configurazione globale del componente, affinché possa trovare le immagini archiviate nei vecchi percorsi."
FILES_JOOMGALLERY_MIGRATION_CHECK_COMPATIBILITY_MODE="Modalità di compatibilità"
FILES_JOOMGALLERY_MIGRATION_CHECK_COMPATIBILITY_MODE_ON_DESC="Hai scelto di utilizzare la vecchia struttura di cartelle nel passaggio 1. Perché funzioni, la modalità compatibilità deve essere abilitata nella configurazione del componente. Abilita la modalità di compatibilità JG3 nella configurazione JoomGallery."
FILES_JOOMGALLERY_MIGRATION_CHECK_COMPATIBILITY_MODE_OFF_DESC="Hai scelto di utilizzare la nuova struttura di cartelle nel passaggio 1. Perché funzioni, la modalità compatibilità deve essere disabilitata nella configurazione del componente. Disattiva la \"modalità compatibilità JG3\" nella configurazione JoomGallery."
FILES_JOOMGALLERY_SERVICE_MIGRATION_MCR="Sposta/Copia/Ricrea"
FILES_JOOMGALLERY_SERVICE_MIGRATION_MCR_ERROR="Non è possibile spostare, copiare o ricreare le immagini nello stesso file system (stesso joomla, stesso file system) mantenendo la vecchia struttura delle cartelle. Le opzioni di migrazione scelte sono incompatibili. Modificale per proseguire. Combinazione incompatibile: [Utilizzo delle immagini: Sposta|Copia|Ricrea, Stessa installazione Joomla: Sì, Usa una nuova struttura di cartelle: No, (config JG4)File system: Locale]"
FILES_JOOMGALLERY_SERVICE_MIGRATION_ALIAS_UNIQUE="Alias unico"
FILES_JOOMGALLERY_SERVICE_MIGRATION_ALIAS_UNIQUE_ERROR="L'alias univoco è disabilitato per la migrazione. Tuttavia, nell'origine sono presenti record che potrebbero creare problemi dopo la migrazione poiché produrranno voci di alias non univoche. Ti consigliamo di correggere questi record nell'origine prima della migrazione. Sono stati rilevati problemi per i seguenti record: <br />Tipo di contenuto: %s; Tabella: %s; ID: %s"
FILES_JOOMGALLERY_MIGRATION_WITH_RULES_LABEL="Categoria ACL"
FILES_JOOMGALLERY_MIGRATION_WITH_RULES_DESC="Vuoi trasferire le regole ACL delle categorie?{tip}Da JG3 possono essere trasferite soltanto le regole delle categorie, perché le risorse sono state modificate profondamente per allinearle alla struttura del codice del core di Joomla!."

